name: Refresh Watchwise catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch current India catalog
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_REGION: IN
          TMDB_LANGUAGE: en-IN
          TMDB_PAGES: 3
          CATALOG_OUTPUT: dist/data/catalog.json
        run: node scripts/sync_tmdb.mjs
      - name: Commit refreshed catalog
        run: |
          git config user.name "watchwise-bot"
          git config user.email "watchwise-bot@users.noreply.github.com"
          git add dist/data/catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh catalog data"
          git push
